<!DOCTYPE html>
<html>
<head>
    <base href="/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Glyphora</title>
  <link rel="stylesheet" href="glyphora-tokens.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="glyphora-web.css">
  <script defer src="main.client.dart.js"></script>
    <script>
      (() => {
        const players = new Map();

        let hlsLoadPromise = null;

        const ensureHlsLoaded = () => {
          if (window.Hls) {
            return Promise.resolve(window.Hls);
          }

          if (hlsLoadPromise) {
            return hlsLoadPromise;
          }

          hlsLoadPromise = new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/hls.js@1.7.3/dist/hls.min.js';
            script.async = true;

            script.onload = () => {
              if (window.Hls) {
                resolve(window.Hls);
              } else {
                hlsLoadPromise = null;
                reject(new Error('hls.js loaded but window.Hls is unavailable'));
              }
            };

            script.onerror = () => {
              hlsLoadPromise = null;
              reject(new Error('Failed to load hls.js'));
            };

            document.head.appendChild(script);
          });

          return hlsLoadPromise;
        };

        const destroyPlayer = (videoId) => {
          const current = players.get(videoId);
          if (current) {
            current.destroy();
            players.delete(videoId);
          }
        };

        document.addEventListener('glyphora-hls-attach', async (event) => {
          const detail = event.detail || {};
          const videoId = detail.videoId;
          const url = detail.url;
          const fallbackUrl = detail.fallbackUrl;

          if (!videoId || !url) return;

          const video = document.getElementById(videoId);
          if (!video) return;

          destroyPlayer(videoId);

          if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.dispatchEvent(new CustomEvent('glyphora-hls-ready'));
            return;
          }

          try {
            const Hls = await ensureHlsLoaded();

            if (!document.getElementById(videoId)) {
              return;
            }

            if (Hls.isSupported()) {
              const hls = new Hls({
                capLevelToPlayerSize: true,
                startLevel: -1,
              });

              players.set(videoId, hls);
              hls.loadSource(url);
              hls.attachMedia(video);

              hls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.dispatchEvent(new CustomEvent('glyphora-hls-ready'));
              });

              hls.on(Hls.Events.ERROR, (_name, data) => {
                if (!data || !data.fatal) return;

                destroyPlayer(videoId);

                if (fallbackUrl) {
                  const currentTime = video.currentTime || 0;
                  const wasPaused = video.paused;

                  video.src = fallbackUrl;
                  video.currentTime = currentTime;

                  if (!wasPaused) {
                    video.play().catch(() => {});
                  }
                }

                video.dispatchEvent(
                  new CustomEvent('glyphora-hls-unavailable'),
                );
              });

              return;
            }
          } catch (_) {
            // Fall through to the existing MP4/failure path below.
          }

          if (fallbackUrl) {
            video.src = fallbackUrl;
          }

          video.dispatchEvent(
            new CustomEvent('glyphora-hls-unavailable'),
          );
        });

        document.addEventListener('glyphora-hls-quality', (event) => {
          const detail = event.detail || {};
          const videoId = detail.videoId;
          const height = detail.height;
          const hls = players.get(videoId);

          if (!hls) return;

          if (height === null || height === undefined) {
            hls.currentLevel = -1;
            return;
          }

          const numericHeight = Number(height);
          const index = hls.levels.findIndex(
            (level) => Number(level.height) === numericHeight,
          );

          if (index >= 0) {
            hls.currentLevel = index;
          }
        });

        document.addEventListener('glyphora-hls-destroy', (event) => {
          const detail = event.detail || {};
          if (detail.videoId) {
            destroyPlayer(detail.videoId);
          }
        });
      })();
    </script>
    <script>
      /* Shared theme boot (glyphora_web_l10n ThemeToggle): applies the stored or
         system theme before first paint. */
      (function () {
        try {
          var key = 'glyphora-theme';
          var m = /(?:^#|&)theme=(light|dark)(?:&|$)/.exec(location.hash);
          if (m) localStorage.setItem(key, m[1]);
          var saved = localStorage.getItem(key);
          var dark = saved === 'dark' ||
            (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
</head>
<body>
</body>
</html>
